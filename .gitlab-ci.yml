stages:
  - build
  - release

build:
  stage: build
  image: node:24.14.1
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run compile
  tags:
    - size-m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

package:
  stage: build
  image: node:24.14.1
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run compile
    - npx @vscode/vsce package
    - VSIX=$(ls *.vsix)
    - echo "VSIX_FILE=${VSIX}" >> build.env
    - |
      curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --upload-file "$VSIX" \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/dexter-vscode/${CI_COMMIT_TAG}/${VSIX}"
  artifacts:
    reports:
      dotenv: build.env
    expire_in: 1 week
  tags:
    - size-m
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: package
      artifacts: true
  variables:
    GITLAB_TOKEN: $GITLAB_TOKEN
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    description: "Release $CI_COMMIT_TAG"
    assets:
      links:
        - name: $VSIX_FILE
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/dexter-vscode/${CI_COMMIT_TAG}/${VSIX_FILE}"
          link_type: package
  tags:
    - size-m
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
