name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm

      - run: npm ci

      - run: npm run compile

      - run: npm test

      # Catches a malformed package.json or a missing contributed file before a tag.
      - name: Verify the extension packages
        run: npx @vscode/vsce package --out dexter-lsp-ci.vsix
