name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm

      - run: npm ci

      # A tag that disagrees with package.json would publish a wrong version.
      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($pkg)." >&2
            exit 1
          fi

      # The marketplaces use different publisher namespaces and a .vsix embeds
      # its publisher, so each one needs its own package.
      - name: Package for both marketplaces
        run: |
          make package
          make package-openvsx

      - name: Extract the changelog section for this version
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## v" v "$" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md section for $GITHUB_REF_NAME." >&2
            exit 1
          fi
          cat release-notes.md

      - uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: |
            dexter-lsp-*.vsix
